databaseChangeLog:
  - changeSet:
      id: 002-create-group-tables
      author: adit
      changes:
        - createTable:
            tableName: group
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: uid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueDate: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueDate: NOW()
                  constraints:
                    nullable: false
        - createTable:
            tableName: group_permission
            columns:
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_permission_group
                    references: group(id)
                    onDelete: CASCADE
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_permission_permission
                    references: permission(id)
                    onDelete: CASCADE
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueDate: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: group_permission
            columnNames: group_id, permission_id
            constraintName: pk_group_permission
        - createIndex:
            indexName: idx_group_permission_group
            tableName: group_permission
            columns:
              - column:
                  name: group_id
        - createIndex:
            indexName: idx_group_permission_permission
            tableName: group_permission
            columns:
              - column:
                  name: permission_id
        - createIndex:
            indexName: idx_group_uid
            tableName: group
            columns:
              - column:
                  name: uid
        - addUniqueConstraint:
            constraintName: uq_group_name
            tableName: group
            columnNames: name
