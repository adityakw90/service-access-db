databaseChangeLog:
  - changeSet:
      id: 004-create-subject-role
      author: adit
      changes:
        - createTable:
            tableName: subject_role
            columns:
              - column:
                  name: subject_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: subject_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_subject_role_role
                    referencedTableName: role
                    referencedColumnNames: id
                    onDelete: CASCADE
              - column:
                  name: assigned_at
                  type: TIMESTAMPTZ
                  defaultValueDate: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: subject_role
            columnNames: subject_id, subject_type, role_id
            constraintName: pk_subject_role
        - createIndex:
            indexName: idx_subject_role_subject
            tableName: subject_role
            columns:
              - column:
                  name: subject_id
              - column:
                  name: subject_type
        - createIndex:
            indexName: idx_subject_role_role
            tableName: subject_role
            columns:
              - column:
                  name: role_id
        - addUniqueConstraint:
            constraintName: uq_subject_role
            tableName: subject_role
            columnNames: subject_id, subject_type, role_id
